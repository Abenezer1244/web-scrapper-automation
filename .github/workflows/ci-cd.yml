name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridgeleads
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: bridgeleads_test
        ports:
          - 5432:5432
          # SyncSessionLocal rewrites :5432->:6543 (Supabase pgbouncer routing in
          # src/db/session.py). Map host 6543 to the same postgres so the sync-DB
          # tests (registry/workers/property_membership) connect to the test DB.
          - 6543:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The pytest suite reads TEST_DATABASE_URL (enforced by tests/_db_safety.py),
      # NOT DATABASE_URL — the guard pins DATABASE_URL/_SYNC to these test URLs at
      # import. DATABASE_URL/_SYNC are still provided for any non-pytest step.
      TEST_DATABASE_URL: postgresql+asyncpg://bridgeleads:testpassword@localhost:5432/bridgeleads_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://bridgeleads:testpassword@localhost:5432/bridgeleads_test
      DATABASE_URL: postgresql+asyncpg://bridgeleads:testpassword@localhost:5432/bridgeleads_test
      DATABASE_URL_SYNC: postgresql+psycopg2://bridgeleads:testpassword@localhost:5432/bridgeleads_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      R2_ENDPOINT_URL: https://fake.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: fake
      R2_SECRET_ACCESS_KEY: fake
      R2_BUCKET_NAME: bridgeleads-exports
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      STRIPE_PRICE_PRO: price_fake_pro
      STRIPE_PRICE_BUSINESS: price_fake_business
      STRIPE_PRICE_AGENCY: price_fake_agency
      RESEND_API_KEY: re_fake
      EMAIL_FROM: noreply@bridgeleads.io
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: test
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff==0.15.6   # pinned so CI lint matches local; bump deliberately

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run migrations
        run: alembic upgrade head

      # Block scalar: the inline f-string contains "OK: " whose colon-space made
      # this an invalid YAML mapping, which failed the whole workflow at startup
      # (0 jobs ran). `run: |` keeps it literal.
      - name: Verify app starts (catch import-time crashes)
        run: |
          python -c "from main import app; print(f'OK: {len(app.routes)} routes loaded')"

      # API contract: schema/openapi.json is the source of truth the frontend
      # generates TS types from. Fail if a code change altered the schema without
      # re-committing it (run `python scripts/export_openapi.py` to update).
      - name: Check OpenAPI schema is current
        run: python scripts/export_openapi.py --check

      # -m "not integration": RLS tests need provisioned cutover roles + RLS_ENFORCE
      # (provision_rls_roles.sql, not in migrations) that a plain CI postgres lacks.
      # They run in a dedicated prod-DB context, not this unit job.
      - name: Run tests
        run: pytest tests/ -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─── Dependency audit (M3) ────────────────────────────────────────────────────
  # Fails the pipeline on any known vulnerability in the pinned dependency tree,
  # and publishes a CycloneDX SBOM artifact. Audits requirements.txt (resolves
  # transitive deps) rather than the runner venv, so it never reports the runner's
  # global/tooling packages. npm audit lives in the separate frontend repo.
  dependency-audit:
    name: Dependency Audit (pip-audit + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit (pinned)
        run: pip install pip-audit==2.10.0

      # SBOM first, with || true, so the artifact uploads even when the audit
      # below fails (pip-audit exits non-zero on findings).
      - name: Generate CycloneDX SBOM
        run: pip-audit -r requirements.txt --format=cyclonedx-json --output sbom.cdx.json || true

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # Gate: any known vuln fails the build. For an UNFIXABLE advisory, add an
      # explicit, dated, commented --ignore-vuln <ID> below (keep the list small
      # and visible). Currently empty — the dependency tree audits clean.
      - name: Audit dependencies (fail on known vulns)
        run: pip-audit -r requirements.txt --desc

  # ─── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, dependency-audit]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy Staging ───────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: railway up --service api --environment staging

  # ─── Deploy Production ────────────────────────────────────────────────────────
  deploy-production:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+asyncpg://unused:unused@localhost/unused' }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379/0' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'migration-ci-placeholder-not-used-in-production!!' }}
          # H3 (migration 053): the User.email cutover reconciles email_hmac =
          # blind_index(email) IN-MIGRATION, so the migration runner MUST have the
          # SAME BLIND_INDEX_KEY the app uses for login lookups — otherwise it hashes
          # under the SECRET_KEY fallback and locks every user out (Codex P1). It also
          # fails closed if the key is absent in production. FIELD_ENCRYPTION_KEY is
          # provided too so decrypt_field uses the same Fernet key as the app.
          BLIND_INDEX_KEY: ${{ secrets.BLIND_INDEX_KEY }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        run: |
          pip install -r requirements.txt
          alembic upgrade head
