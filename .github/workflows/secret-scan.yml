name: secret-scan

# Blocks new commits that carry credentials. Added 2026-10-31, after a Cloudflare
# token in infra/terraform/terraform.tfvars and plaintext passwords in docs/ were
# found readable while this repo was public.
#
# Scope: the commits in each push or pull request (the action's default), not
# all of history. History is known to contain the leaked values, so a
# full-history scan would fail every run; those credentials are handled by
# rotation (tasks/todo-public-repo-exposure-2026-10-31.md), never by an allowlist.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  # The action lists a pull request's commits to know what to scan.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # v3.0.0, pinned by commit.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A SARIF artifact or PR comment would repeat the matched secret.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
