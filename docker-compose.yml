# LOCAL DEVELOPMENT ONLY — production runs on Railway (no docker-compose).
#
# This stack never consumes the checkout's `.env`, and whatever `.env.local` holds
# it cannot reach a production database or Redis, use a production key, or turn
# on anything paid or destructive (tests/test_local_compose_env.py enforces it):
#   * App services read `.env.local` (cp .env.example .env.local), NEVER `.env`:
#     a checkout's `.env` may name production (the synced OneDrive one does).
#   * No ${...} interpolation anywhere: compose reads the project `.env` to fill it.
#   * Everything below is pinned in `environment:`, which beats `env_file:`:
#     the database and Redis URLs point at THESE containers; the signing and
#     encryption keys are local-only; paid and destructive switches are OFF.
#   * Only ./src and ./main.py are mounted (hot reload): no host `.env` is visible
#     in /app for pydantic's env_file to read, and the image excludes it
#     (.dockerignore).
# What `.env.local` still supplies is the developer's own third-party keys (Stripe
# test mode, a dev R2 bucket, Resend): use test-mode keys only.
# Every password and key written below is a throwaway local value, public on
# purpose; both containers listen on 127.0.0.1 only.

x-app-env: &app-env
  # No port on the database URLs: src/db/session.py rewrites ":5432/" to ":6543/"
  # (the Supabase pooler) on the sync URL, and nothing listens on 6543 here.
  DATABASE_URL: postgresql+asyncpg://bridgeleads:bridgeleads_local_only@postgres/bridgeleads
  DATABASE_URL_SYNC: postgresql+psycopg2://bridgeleads:bridgeleads_local_only@postgres/bridgeleads
  DATABASE_URL_MIGRATE: postgresql+psycopg2://bridgeleads:bridgeleads_local_only@postgres/bridgeleads
  REDIS_URL: redis://:bridgeleads_local_only@redis:6379/0
  # Settings default to "production", which turns on production-only paths.
  ENVIRONMENT: development
  FRONTEND_URL: http://localhost:3000
  API_BASE_URL: http://localhost:8000
  ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  # Local-only keys, so a production key pasted into .env.local is never used
  # here (a JWT signed with production's SECRET_KEY would be accepted THERE).
  # Blank encryption / blind-index keys fall back to one derived from SECRET_KEY
  # outside production and strict mode.
  SECRET_KEY: local-dev-only-secret-key-never-used-outside-docker-compose
  FIELD_ENCRYPTION_KEY: ""
  BLIND_INDEX_KEY: ""
  PII_ENCRYPTION_STRICT: "false"
  TRACERFY_WEBHOOK_SECRET: ""
  # Real money or irreversible deletes, whatever .env.local says.
  SKIP_TRACE_ENABLED: "false"
  TRACERFY_API_TOKEN: ""
  CAPTCHA_ENABLED: "false"
  REGRID_ENABLED: "false"
  AI_ENRICHMENT_ENABLED: "false"
  RETENTION_PURGE_ENABLED: "false"
  RETENTION_PURGE_DRY_RUN: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridgeleads
      POSTGRES_USER: bridgeleads
      POSTGRES_PASSWORD: bridgeleads_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgeleads"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass bridgeleads_local_only
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bridgeleads_local_only", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    # As production boot does: advisory-locked, idempotent.
    command: python scripts/migrate.py
    env_file: .env.local
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env.local
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py

  worker:
    build: .
    command: celery -A src.workers worker --loglevel=info --concurrency=2
    env_file: .env.local
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py

  beat:
    build: .
    command: celery -A src.workers beat --loglevel=info
    env_file: .env.local
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py

volumes:
  postgres_data:
