# BridgeLeads API — Nginx reverse proxy
# TLS termination, rate limiting, SSE support

# ─── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;
limit_req_zone $binary_remote_addr zone=jobs:10m     rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m  rate=60r/m;

# ─── Upstream ─────────────────────────────────────────────────────────────────
upstream bridgeleads_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.bridgeleads.io;
    return 301 https://$host$request_uri;
}

# ─── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.bridgeleads.io;

    # TLS — managed by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/api.bridgeleads.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bridgeleads.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers (belt — FastAPI middleware is suspenders)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Request size limit (prevent large payload attacks)
    client_max_body_size 1m;

    # ─── Auth endpoints (strict rate limit) ──────────────────────────────────
    location ~ ^/auth/(login|register) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bridgeleads_api;
        include /etc/nginx/proxy_params;
    }

    # ─── Job creation (rate limited) ─────────────────────────────────────────
    location = /jobs {
        limit_req zone=jobs burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://bridgeleads_api;
        include /etc/nginx/proxy_params;
    }

    # ─── SSE log streaming ────────────────────────────────────────────────────
    location ~ ^/jobs/[^/]+/logs$ {
        proxy_pass http://bridgeleads_api;
        include /etc/nginx/proxy_params;

        # SSE-specific settings
        proxy_buffering             off;
        proxy_cache                 off;
        chunked_transfer_encoding   on;
        proxy_read_timeout          300s;
        proxy_send_timeout          300s;
        keepalive_timeout           300s;

        # Required SSE headers
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # ─── Stripe webhook (no rate limit — Stripe IPs only) ────────────────────
    location = /billing/webhook {
        # Cloudflare proxies Stripe IPs — real IP restoration handled by CF
        proxy_pass http://bridgeleads_api;
        include /etc/nginx/proxy_params;
        client_max_body_size 256k;
    }

    # ─── General API ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://bridgeleads_api;
        include /etc/nginx/proxy_params;
    }
}
