[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security checks
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert — used in tests
    "S311",  # random — not used for crypto
    "B008",  # Depends() calls in FastAPI function args
    "N806",  # uppercase in function (SQLAlchemy patterns)
    "E501",  # line too long — long lines in HTML emails and SQL are acceptable
    "B904",  # raise from err — not required for HTTP exceptions re-raised in handlers
    "S105",  # hardcoded password — false positive on token_type = "bearer"
    "S110",  # try-except-pass — intentional for optional/soft-fail operations
    "S112",  # try-except-continue — same intent as S110 (soft-fail inside a loop)
    "UP042", # str,Enum -> StrEnum — NOT applied: StrEnum changes str(member) from
             # "Class.NAME" to the value in 3.12; risky for any str(enum)/serialization
             # that relies on the current behavior. Revisit deliberately, with tests.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N", "E402"]   # Relax security + naming; E402 = path/env setup before imports
"alembic/*" = ["E501"]   # Long lines acceptable in migrations
# S608: these two build dynamic SQL by interpolating only generated ":param"
# PLACEHOLDER strings (values are always bound via params dicts — verified); the
# heuristic can't see the binding. Scoped per-file so the rule stays active elsewhere.
"src/workers/tasks.py" = ["S608"]
"src/workers/tasks_helpers/dedup.py" = ["S608"]   # membership/property_key SQL builders moved here from tasks.py
"src/workers/tasks_helpers/enrich.py" = ["S608"]  # duplicate-reuse SQL builder moved here from tasks.py
"src/api/routes/scrapers.py" = ["S608"]
"src/api/routes/segments.py" = ["S608"]   # segment SQL interpolates only generated tax_cap_sql/{county_clause} placeholders; values bound via params
"src/workers/batch_export.py" = ["S608"]  # combined-export SQL interpolates only the tax_cap_sql placeholder; values bound via params

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"   # pytest-asyncio 1.x: tests share the session loop (matches session-scoped engine fixture)
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: needs a prod-like DB (RLS roles + RLS_ENFORCE); excluded from the unit CI job via -m 'not integration'",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:pytest_asyncio",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src"]
omit = [
    "src/db/migrations/*",
    "alembic/*",
    "tests/*",
    "src/scrapers/enrichment/*",           # external parcel API — no live test environment
    "src/scrapers/pierce_wa_probate.py",   # Playwright scraper — requires live county portal
    "src/scrapers/ai/*",                   # AI scraper — requires Claude API key
    "src/scrapers/ai_scraper.py",          # AI scraper — requires Claude API key
    "src/workers/tasks.py",               # Celery task runner — requires Celery broker
    "src/workers/tasks_helpers/*",        # pipeline-phase helpers relocated from tasks.py — same task-runner code, same omit
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 34   # current real floor (~35% with integration tests excluded; CI
                  # never ran before so 55 was never enforced). Acts as a no-regression
                  # ratchet — raise it as scraper/worker test coverage is added.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
