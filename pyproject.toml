[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security checks
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert — used in tests
    "S311",  # random — not used for crypto
    "B008",  # Depends() calls in FastAPI function args
    "N806",  # uppercase in function (SQLAlchemy patterns)
    "E501",  # line too long — long lines in HTML emails and SQL are acceptable
    "B904",  # raise from err — not required for HTTP exceptions re-raised in handlers
    "S105",  # hardcoded password — false positive on token_type = "bearer"
    "S110",  # try-except-pass — intentional for optional/soft-fail operations
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]   # Relax security + naming rules in tests
"alembic/*" = ["E501"]   # Long lines acceptable in migrations

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:pytest_asyncio",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src"]
omit = [
    "src/db/migrations/*",
    "alembic/*",
    "tests/*",
    "src/scrapers/enrichment.py",          # external parcel API — no live test environment
    "src/scrapers/pierce_wa_probate.py",   # Playwright scraper — requires live county portal
    "src/workers/tasks.py",                # Celery task runner — requires Celery broker
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
